      font-family: "Fredoka", sans-serif; font-weight: 700; line-height: 1.05; color: #fff;

    }
    .palabra { display: inline-block; white-space: nowrap; }
    .letra { display: inline-block; }
    .tarjeta {
      position: absolute; background: #fff; border-radius: 64px; padding: 16px;
      box-shadow: 0 18px 0 rgba(217, 78, 0, 0.28);
    }
    .sprite { width: 100%; height: 100%; border-radius: 50px; background-repeat: no-repeat; background-color: var(--crema); }
    .estrella { position: absolute; width: 90px; height: 90px; opacity: 0; }
