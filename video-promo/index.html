<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Nailong Promo — Tráiler Oficial de Lanzamiento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div data-hf-id="hf-gddz" id="root" 
       data-composition-id="nailong-promo" 
       data-width="1080" 
       data-height="1920" 
       data-start="0" 
       data-duration="17" 
       data-fps="30">
    
    <!-- Audio de Fondo: BGM Oficial Alegre y Saltarina -->
    <audio id="bgm"
           src="assets/audio/nailong_theme.wav"
           data-start="0"
           data-duration="17"
           data-track-index="1"
           data-volume="0.8"></audio>

    <!-- Escena 1: El Gancho Viral (0s - 3.5s) -->
    <div data-hf-id="hf-4e7e" id="scene1"
         data-composition-id="scene1"
         data-composition-src="compositions/scene1.html"
         data-start="0"
         data-duration="3.5"
         data-track-index="0"
         data-width="1080"
         data-height="1920"></div>

    <!-- Escena 2: La Pancita y el Modo Fiesta (3.5s - 8s) -->
    <div data-hf-id="hf-8xr2" id="scene2"
         data-composition-id="scene2"
         data-composition-src="compositions/scene2.html"
         data-start="3.5"
         data-duration="4.5"
         data-track-index="0"
         data-width="1080"
         data-height="1920"></div>

    <!-- Escena 3: Colección de Cromos y Minijuego (8s - 13s) -->
    <div data-hf-id="hf-7d5z" id="scene3"
         data-composition-id="scene3"
         data-composition-src="compositions/scene3.html"
         data-start="8"
         data-duration="5"
         data-track-index="0"
         data-width="1080"
         data-height="1920"></div>

    <!-- Escena 4: Cierre, CTA y APK (13s - 17s) -->
    <div data-hf-id="hf-g4xp" id="scene4"
         data-composition-id="scene4"
         data-composition-src="compositions/scene4.html"
         data-start="13"
         data-duration="4"
         data-track-index="0"
         data-width="1080"
         data-height="1920"></div>

  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    window.__timelines["nailong-promo"] = tl;
  </script>
</body>
</html>
