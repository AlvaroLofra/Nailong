<!doctype html>
<html>
<body>
  <template>
    <style>
      #root { position: absolute; inset: 0; overflow: hidden; }
      #fondo-cielo { position: absolute; inset: 0; background: linear-gradient(180deg, #8FD3FF 0%, #BDE6FF 45%, #FFF4C9 100%); }
      .fondo-capa { position: absolute; left: 0; top: 0; width: 3000px; height: 1080px; }
      .nube { position: absolute; }
      .colina { position: absolute; border-radius: 50%; }
    </style>

    <div id="root" data-composition-id="fondo" data-width="1920" data-height="1080">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <g id="fondo-nube">
            <g fill="#DCEFFF" transform="translate(0 10)">
              <circle cx="60" cy="75" r="40" /><circle cx="110" cy="55" r="50" /><circle cx="165" cy="78" r="38" />
              <rect x="60" y="75" width="105" height="40" />
            </g>
            <g fill="#FFFFFF">
              <circle cx="60" cy="75" r="40" /><circle cx="110" cy="55" r="50" /><circle cx="165" cy="78" r="38" />
              <rect x="60" y="75" width="105" height="40" />
            </g>
          </g>
        </defs>
      </svg>
      <div id="fondo-cielo"></div>

      <!-- Tres capas de nubes: las lejanas pequeñas y lentas, las cercanas grandes y rápidas.
           Cada capa mide 3000 px de ancho para que nunca se quede sin nubes al desplazarse. -->
      <div id="fondo-lejos" class="fondo-capa" data-layout-ignore>
        <svg class="nube" style="left:80px;top:110px;opacity:.6" width="220" height="130" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
        <svg class="nube" style="left:640px;top:60px;opacity:.6" width="180" height="106" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
        <svg class="nube" style="left:1180px;top:150px;opacity:.6" width="220" height="130" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
        <svg class="nube" style="left:1720px;top:80px;opacity:.6" width="200" height="118" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
        <svg class="nube" style="left:2280px;top:140px;opacity:.6" width="220" height="130" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
        <svg class="nube" style="left:2760px;top:70px;opacity:.6" width="180" height="106" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
      </div>
      <div id="fondo-medio" class="fondo-capa" data-layout-ignore>
        <svg class="nube" style="left:-80px;top:420px;opacity:.85" width="340" height="200" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
        <svg class="nube" style="left:680px;top:330px;opacity:.85" width="300" height="177" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
        <svg class="nube" style="left:1340px;top:460px;opacity:.85" width="340" height="200" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
        <svg class="nube" style="left:2000px;top:350px;opacity:.85" width="300" height="177" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
        <svg class="nube" style="left:2640px;top:440px;opacity:.85" width="340" height="200" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
      </div>
      <div id="fondo-cerca" class="fondo-capa" data-layout-ignore>
        <svg class="nube" style="left:-120px;top:790px" width="560" height="330" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
        <svg class="nube" style="left:560px;top:830px" width="500" height="295" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
        <svg class="nube" style="left:1220px;top:800px" width="560" height="330" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
        <svg class="nube" style="left:1900px;top:840px" width="500" height="295" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
        <svg class="nube" style="left:2540px;top:800px" width="560" height="330" viewBox="0 0 220 130"><use href="#fondo-nube" /></svg>
      </div>

      <!-- Colinas al pie: el «suelo» donde aterriza todo, de lado a lado -->
      <div class="colina" style="left:-300px;top:930px;width:1200px;height:520px;background:#9BE59B" data-layout-ignore></div>
      <div class="colina" style="left:640px;top:965px;width:1300px;height:520px;background:#86D886" data-layout-ignore></div>
      <div class="colina" style="left:1560px;top:940px;width:1000px;height:520px;background:#9BE59B" data-layout-ignore></div>

      <!-- Adornos en los laterales: burbujitas flotantes y flores al pie -->
      <div id="fondo-adornos" class="fondo-capa" data-layout-ignore>
        <svg style="position:absolute;left:36px;top:260px" width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="#FFFFFF" opacity="0.65" /></svg>
        <svg style="position:absolute;left:26px;top:520px" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#FFE66D" opacity="0.6" /></svg>
        <svg style="position:absolute;left:40px;top:770px" width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="#FFFFFF" opacity="0.7" /></svg>
        <svg style="position:absolute;left:1856px;top:280px" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="#FFE66D" opacity="0.55" /></svg>
        <svg style="position:absolute;left:1864px;top:540px" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#FFFFFF" opacity="0.65" /></svg>
        <svg style="position:absolute;left:1850px;top:790px" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#FFE66D" opacity="0.55" /></svg>
        <svg style="position:absolute;left:50px;top:1010px" width="48" height="48" viewBox="0 0 100 100"><circle cx="50" cy="50" r="24" fill="#FFFBEA"/><circle cx="50" cy="24" r="18" fill="#FF8FA3"/><circle cx="76" cy="50" r="18" fill="#FF8FA3"/><circle cx="50" cy="76" r="18" fill="#FF8FA3"/><circle cx="24" cy="50" r="18" fill="#FF8FA3"/><circle cx="50" cy="50" r="14" fill="#FFE66D"/></svg>
        <svg style="position:absolute;left:1820px;top:1020px" width="48" height="48" viewBox="0 0 100 100"><circle cx="50" cy="50" r="24" fill="#FFFBEA"/><circle cx="50" cy="24" r="18" fill="#FFE66D"/><circle cx="76" cy="50" r="18" fill="#FFE66D"/><circle cx="50" cy="76" r="18" fill="#FFE66D"/><circle cx="24" cy="50" r="18" fill="#FFE66D"/><circle cx="50" cy="50" r="14" fill="#FF8A00"/></svg>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // Paralaje: cada capa avanza a su ritmo durante los 32 s (recorridos ajustados a 3000 px de capa).
      tl.fromTo("#fondo-lejos", { x: 0 }, { x: -300, duration: 32, ease: "none" }, 0);
      tl.fromTo("#fondo-medio", { x: 0 }, { x: -640, duration: 32, ease: "none" }, 0);
      tl.fromTo("#fondo-cerca", { x: 0 }, { x: -1000, duration: 32, ease: "none" }, 0);
      tl.fromTo("#fondo-adornos", { y: 0 }, { y: -40, duration: 4, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
      window.__timelines["fondo"] = tl;
    </script>
  </template>
</body>
</html>
