<!doctype html>
<html>
<body>
  <template>
    <style>
      @font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      #root { position: absolute; inset: 0; overflow: hidden; }
      #e1-arcoiris { position: absolute; left: 40px; top: 470px; width: 1000px; height: 520px; }
      #e1-hola { top: 170px; font-size: 200px; }
      #e1-soy { top: 385px; font-size: 104px; }
      #e1-carta { left: 240px; top: 600px; width: 600px; height: 600px; }
      #e1-cara { left: 190px; top: 560px; width: 700px; height: 700px; }
      #e1-destellos { position: absolute; inset: 0; }
    </style>

    <div id="root" data-composition-id="saludo" data-width="1080" data-height="1920">
      <!-- Arcoíris que se dibuja de un lado a otro detrás de Nailong -->
      <svg id="e1-arcoiris" viewBox="0 0 1000 520" data-layout-ignore>
        <g fill="none" stroke-width="34" stroke-linecap="round">
          <path id="e1-arco-1" d="M 30 500 A 470 470 0 0 1 970 500" stroke="#FF8FA3" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
          <path id="e1-arco-2" d="M 64 500 A 436 436 0 0 1 936 500" stroke="#FFB86B" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
          <path id="e1-arco-3" d="M 98 500 A 402 402 0 0 1 902 500" stroke="#FFE66D" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
          <path id="e1-arco-4" d="M 132 500 A 368 368 0 0 1 868 500" stroke="#9BE59B" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
          <path id="e1-arco-5" d="M 166 500 A 334 334 0 0 1 834 500" stroke="#8FD3FF" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
          <path id="e1-arco-6" d="M 200 500 A 300 300 0 0 1 800 500" stroke="#C3A6FF" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
        </g>
      </svg>

      <!-- Plano 1: cuerpo entero saludando (sticker 58) -->
      <div id="e1-carta" class="tarjeta"><div id="e1-sprite-58" class="sprite"></div></div>
      <!-- Plano 2: primer plano de la cara (sticker 92) -->
      <div id="e1-cara" class="tarjeta"><div id="e1-sprite-92" class="sprite"></div></div>

      <h1 id="e1-hola" class="titulo">¡Hola!</h1>
      <h2 id="e1-soy" class="titulo">Soy Nailong</h2>

      <div id="e1-destellos" data-layout-ignore>
        <svg class="estrella" style="left:120px;top:640px" viewBox="0 0 100 100"><path d="M50 0 L61 39 L100 50 L61 61 L50 100 L39 61 L0 50 L39 39 Z" fill="#FFD23F" /></svg>
        <svg class="estrella" style="left:880px;top:700px" viewBox="0 0 100 100"><path d="M50 0 L61 39 L100 50 L61 61 L50 100 L39 61 L0 50 L39 39 Z" fill="#fff" /></svg>
        <svg class="estrella" style="left:90px;top:1150px" viewBox="0 0 100 100"><path d="M50 0 L61 39 L100 50 L61 61 L50 100 L39 61 L0 50 L39 39 Z" fill="#fff" /></svg>
        <svg class="estrella" style="left:900px;top:1180px" viewBox="0 0 100 100"><path d="M50 0 L61 39 L100 50 L61 61 L50 100 L39 61 L0 50 L39 39 Z" fill="#FFD23F" /></svg>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);

      // Fotograma 0 ya muestra a Nailong (es la miniatura del vídeo): entra con un rebote corto.
      tl.fromTo("#e1-carta", { scaleX: 1.12, scaleY: 0.86, transformOrigin: "50% 100%" },
        { scaleX: 1, scaleY: 1, duration: 0.7, ease: "elastic.out(1.1, 0.35)" }, 0);
      nlSprite(tl, $("#e1-sprite-58"), 58, 0, 3.5);

      // El arcoíris se dibuja color a color.
      for (let i = 1; i <= 6; i++) {
        tl.fromTo("#e1-arco-" + i, { attr: { "stroke-dashoffset": 1 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "power2.out" }, 0.05 + i * 0.06);
      }

      // «¡Hola!» bota letra a letra; el primer golpe coincide con el boing (0,98 s).
      nlLetras(tl, $("#e1-hola"), 0.5, 0.06);
      nlLetras(tl, $("#e1-soy"), 1.05, 0.04);

      // 2,0 s: corte a primer plano de la cara.
      tl.fromTo("#e1-carta", { opacity: 1 }, { opacity: 0, duration: 0.01, immediateRender: false }, 2.0);
      tl.fromTo("#e1-cara", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 2.0);
      nlSprite(tl, $("#e1-sprite-92"), 92, 2.0, 1.5);
      nlDestellos(tl, $("#e1-destellos"), 2.05);

      window.__timelines["saludo"] = tl;
    </script>
  </template>
</body>
</html>
