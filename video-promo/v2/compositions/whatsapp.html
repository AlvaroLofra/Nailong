<!doctype html>
<html>
<body>
  <template>
    <style>
      @font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      #root { position: absolute; inset: 0; overflow: hidden; }
      #e6-linea1 { top: 175px; font-size: 118px; }
      #e6-linea2 { top: 300px; font-size: 118px; }
      #e6-movil {
        position: absolute; left: 280px; top: 440px; width: 520px; height: 880px; border-radius: 74px;
        background: #2B2B2B; padding: 18px; box-shadow: 0 18px 0 rgba(0, 0, 0, 0.18);
      }
      #e6-pantalla { position: relative; width: 100%; height: 100%; border-radius: 58px; overflow: hidden; background: #fff; }
      .e6-vista { position: absolute; inset: 0; font-family: "Fredoka", sans-serif; }
      .e6-cabecera { height: 112px; padding: 42px 30px 0; font-weight: 700; font-size: 38px; color: #fff; }
      #e6-app .e6-cabecera { background: var(--naranja); }
      .e6-pack { display: flex; align-items: center; gap: 14px; padding: 16px 22px; border-bottom: 3px solid #FFF0C2; }
      .e6-pack-texto { flex: 1; }
      .e6-pack-nombre { font-weight: 600; font-size: 30px; color: var(--tinta); }
      .e6-pack-num { font-weight: 500; font-size: 28px; color: #A0785A; }
      .e6-pack img { width: 58px; height: 58px; border-radius: 14px; object-fit: cover; }
      #e6-boton {
        position: absolute; left: 34px; right: 34px; bottom: 40px; height: 96px; border-radius: 48px; background: #25D366;
        color: #fff; font-weight: 700; font-size: 36px; text-align: center; line-height: 96px; box-shadow: 0 8px 0 #179B4A;
      }
      #e6-chat { background: #ECE5DD; }
      #e6-chat .e6-cabecera { background: #128C7E; }
      #e6-burbuja {
        position: absolute; left: 22px; top: 150px; max-width: 380px; padding: 18px 24px; border-radius: 8px 30px 30px 30px;
        background: #fff; font-weight: 500; font-size: 30px; color: #303030;
      }
      #e6-enviado { position: absolute; right: 22px; top: 330px; width: 300px; height: 300px; }
      #e6-enviado .sprite { border-radius: 36px; }
      #e6-check { position: absolute; right: 30px; top: 640px; font-weight: 600; font-size: 28px; color: #34B7F1; }
      #e6-dedo {
        position: absolute; left: 520px; top: 1150px; width: 110px; height: 110px; border-radius: 50%;
        background: #fff; border: 10px solid var(--naranja); box-shadow: 0 10px 0 rgba(217, 78, 0, 0.3); z-index: 6;
      }
    </style>

    <div id="root" data-composition-id="whatsapp" data-width="1080" data-height="1920">
      <h1 id="e6-linea1" class="titulo">¡Mándalos por</h1>
      <h1 id="e6-linea2" class="titulo">WhatsApp!</h1>

      <div id="e6-movil">
        <div id="e6-pantalla">
          <!-- Vista 1: la app «Stickers Nailong» con sus 4 packs -->
          <div id="e6-app" class="e6-vista">
            <div class="e6-cabecera" data-layout-allow-overlap>Stickers Nailong</div>
            <div class="e6-pack"><div class="e6-pack-texto"><div class="e6-pack-nombre">Nailong animado 1</div><div class="e6-pack-num">25 stickers</div></div>
              <img src="assets/stills/sticker_58.webp" alt="" /><img src="assets/stills/sticker_13.webp" alt="" /></div>
            <div class="e6-pack"><div class="e6-pack-texto"><div class="e6-pack-nombre">Nailong animado 2</div><div class="e6-pack-num">24 stickers</div></div>
              <img src="assets/stills/sticker_91.webp" alt="" /><img src="assets/stills/sticker_10.webp" alt="" /></div>
            <div class="e6-pack"><div class="e6-pack-texto"><div class="e6-pack-nombre">Nailong animado 3</div><div class="e6-pack-num">24 stickers</div></div>
              <img src="assets/stills/sticker_63.webp" alt="" /><img src="assets/stills/sticker_77.webp" alt="" /></div>
            <div class="e6-pack"><div class="e6-pack-texto"><div class="e6-pack-nombre">Nailong estático</div><div class="e6-pack-num">23 stickers</div></div>
              <img src="assets/stills/sticker_1.webp" alt="" /><img src="assets/stills/sticker_3.webp" alt="" /></div>
            <div id="e6-boton">Añadir a WhatsApp</div>
          </div>

          <!-- Vista 2: un chat donde llega Nailong riéndose (sticker 72) -->
          <div id="e6-chat" class="e6-vista">
            <div class="e6-cabecera" data-layout-allow-overlap>Mis amigos</div>
            <div id="e6-burbuja">¿Tienes stickers de Nailong? 😍</div>
            <div id="e6-enviado"><div id="e6-sprite-72" class="sprite"></div></div>
            <div id="e6-check">✓✓</div>
          </div>
        </div>
      </div>

      <div id="e6-dedo"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);

      nlLetras(tl, $("#e6-linea1"), 0.15, 0.04);
      nlLetras(tl, $("#e6-linea2"), 0.55, 0.045);

      // El móvil entra botando desde abajo mientras pasa la nube.
      nlBotar(tl, $("#e6-movil"), 0.4, { desde: 1300, caida: 0.35 });

      // 1,0 s: el dedo pulsa «Añadir a WhatsApp».
      tl.fromTo("#e6-dedo", { x: 300, y: 500, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.6);
      tl.fromTo("#e6-dedo", { scale: 1 }, { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.in" }, 0.92);
      tl.fromTo("#e6-boton", { scale: 1 }, { scale: 0.93, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.in" }, 0.92);
      tl.fromTo("#e6-dedo", { x: 0, y: 0 }, { x: 320, y: 900, duration: 0.35, ease: "power2.in", immediateRender: false }, 1.15);

      // 1,3 s: pasamos al chat.
      tl.fromTo("#e6-chat", { x: 490 }, { x: 0, duration: 0.3, ease: "power3.out" }, 1.3);
      // Con el chat ya encima, la vista de la app se retira.
      tl.fromTo("#e6-app", { opacity: 1 }, { opacity: 0, duration: 0.01, immediateRender: false }, 1.6);
      tl.fromTo("#e6-burbuja", { scale: 0, transformOrigin: "0% 0%" }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 1.6);

      // 2,0 s: llega el sticker enviado con un rebote (sonido de «enviado»).
      nlSprite(tl, $("#e6-sprite-72"), 72, 2.0, 2.0);
      tl.fromTo("#e6-enviado", { scale: 0, rotation: 12, transformOrigin: "100% 100%" },
        { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)" }, 2.0);
      tl.fromTo("#e6-check", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 2.35);

      window.__timelines["whatsapp"] = tl;
    </script>
  </template>
</body>
</html>
