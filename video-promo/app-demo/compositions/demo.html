          <!-- Diálogo final «¡Añadido a WhatsApp!» -->
          <div id="dlg-exito" class="abs dialogo">
            <div class="exito-emoji">🎉</div>
            <div class="exito-titulo">¡Añadido a WhatsApp!</div>
            <div class="exito-texto">Tus stickers de Nailong ya están listos para usar en tus chats. ¡Ábrelos y empieza a enviarlos!</div>
            <div id="btn-genial" class="btn btn-wa"><span>¡Genial, gracias! 💛</span><span id="rizo-genial" class="rizo"></span></div>
          </div>

          <!-- Aviso de WhatsApp «añadido» (texto traducido de la captura: pendiente de confirmar) -->
          <div id="wa-aviso" class="abs">
            <svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="13" fill="#25D366"/><path fill="none" stroke="#fff" stroke-width="1.6" d="M13 5.5a7.5 7.5 0 0 0-6.5 11.25L5.5 20.5l3.83-1A7.5 7.5 0 1 0 13 5.5z"/><path fill="#fff" d="M10.5 9.4c.25 0 .5 0 .67.42l.67 1.58c.08.25 0 .42-.08.58l-.42.5c-.08.17-.17.33 0 .5.5.92 1.25 1.67 2.17 2.17.17.08.33.08.5-.08l.5-.58c.17-.17.33-.25.58-.17l1.5.75c.25.08.33.25.33.5 0 .5-.25 1.17-.75 1.5-.5.33-1.25.42-2 .17-2-.67-3.67-2.33-4.33-4.33-.25-.75-.17-1.5.17-2 .25-.33.5-.5.5-.5z"/></svg>
            <span>«Mi Selección» se ha añadido a WhatsApp</span>
          </div>

          <div id="onda" class="abs"></div>
          <div id="toque" class="abs"></div>

          <div id="gestos"><div id="gestos-asa"></div></div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ---------- Ayudantes (todo a segundos fijos de la línea de tiempo) ----------
      // Cámara: acerca la pantalla a un punto (fx, fy en dp) con zoom s, sin enseñar nada fuera de la pantalla.
      function camara(t, s, fx, fy, dur, ease) {
        const lim = (v, min) => Math.min(0, Math.max(min, v));
        const x = lim(180 - fx * s, 360 - 360 * s);
        const y = lim(400 - fy * s, 800 - 800 * s);
        tl.to("#camara", { scale: s, x: x, y: y, duration: dur, ease: ease || "power2.inOut" }, t);
      }
      // El toque visible aparece, se mueve hasta (x, y) y pulsa.
      function aparecerToque(t, x, y) {
        tl.set("#toque", { x: x, y: y }, t);
        tl.fromTo("#toque", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, t);
      }
      function moverToque(t, x, y, dur) {
        tl.to("#toque", { x: x, y: y, duration: dur || 0.55, ease: "power2.inOut" }, t);
      }
      function pulsar(t, x, y, rizo) {
        tl.to("#toque", { scale: 0.78, duration: 0.09, ease: "power2.in" }, t);
        tl.to("#toque", { scale: 1, duration: 0.16, ease: "power2.out" }, t + 0.09);
        tl.set("#onda", { x: x, y: y }, t);
        tl.fromTo("#onda", { opacity: 0.85, scale: 1 }, { opacity: 0, scale: 2.4, duration: 0.45, ease: "power2.out" }, t + 0.04);
        if (rizo) tl.fromTo(rizo, { opacity: 1, scale: 0 }, { opacity: 0, scale: 1, duration: 0.45, ease: "power2.out" }, t + 0.04);
      }
      function ocultarToque(t) {
        tl.to("#toque", { opacity: 0, duration: 0.2, ease: "power1.out" }, t);
      }
      function abrirDialogo(t, sel) {
        tl.fromTo(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, t);
      }
      function cerrarDialogo(t, sel) {
        tl.to(sel, { opacity: 0, scale: 0.94, duration: 0.15, ease: "power1.in" }, t);
      }
      function pildora(t, sel) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.12 }, t);
        tl.to(sel, { opacity: 0, duration: 0.15 }, t + 1.0);
      }

      // Centro de los elementos que se tocan (dp). xPercent/yPercent centran el círculo en el punto.
      tl.set(["#toque", "#onda"], { xPercent: -50, yPercent: -50 }, 0);
      tl.set("#camara", { transformOrigin: "0 0", scale: 1, x: 0, y: 0 }, 0);
      tl.set("#detalle", { x: 372 }, 0);
      tl.set(["#dlg-nombre", "#dlg-progreso", "#dlg-exito"], { transformOrigin: "50% 50%" }, 0);
      tl.set("#wa", { y: 800 }, 0);

      // ---------- 0–3,4 s · La app abierta: lista de packs ----------
      camara(1.3, 1.4, 150, 320, 1.0);
      aparecerToque(2.35, 120, 430);
      moverToque(2.55, 92, 361, 0.55);
      pulsar(3.15, 92, 361, "#rizo-ver");

      // ---------- 3,4–10,9 s · Dentro del pack: se eligen 3 stickers ----------
      tl.to("#detalle", { x: 0, duration: 0.45, ease: "power3.out" }, 3.4);
      tl.to("#lista", { x: -60, duration: 0.45, ease: "power3.out" }, 3.4);
      ocultarToque(3.35);
      camara(3.45, 1, 180, 400, 0.7);
      camara(4.45, 1.3, 180, 360, 0.9);

      // Todos los stickers del pack se mueven (la app los reproduce en bucle), cada uno en su punto.
      const PACK = [2, 5, 6, 8, 9, 10, 11, 13, 17, 18, 19, 21, 22, 23, 24, 25, 28, 29, 30, 31, 33, 38, 39, 40];
      PACK.forEach((n, i) => nlSprite(tl, document.querySelector("#s" + n), n, 3.3, 8.2, ((i * 37) % 24) / 24));

      const TOQUES = [
        { n: 10, x: 140.5, y: 320.5, t: 5.95, sub: "#sub-1", pil: "#pil-1" },
        { n: 19, x: 219.5, y: 399.5, t: 7.3, sub: "#sub-2", pil: "#pil-2" },
        { n: 18, x: 140.5, y: 399.5, t: 8.65, sub: "#sub-3", pil: "#pil-3" },
      ];
      aparecerToque(5.2, 200, 520);
      moverToque(5.35, TOQUES[0].x, TOQUES[0].y, 0.5);
      TOQUES.forEach((p, i) => {
        if (i > 0) moverToque(p.t - 0.65, p.x, p.y, 0.5);
        pulsar(p.t, p.x, p.y);
        tl.fromTo("#k" + p.n, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2.5)", transformOrigin: "50% 50%" }, p.t + 0.06);
        pildora(p.t + 0.06, p.pil);
        if (i > 0) tl.set(TOQUES[i - 1].sub, { opacity: 0 }, p.t + 0.06);
        tl.set(p.sub, { opacity: 1 }, p.t + 0.06);
      });
      // Al añadir el primero, la barra enseña el subtítulo «Mi Selección: n / 30» y el título sube
      tl.fromTo("#barra-textos", { y: 0 }, { y: -9, duration: 0.15 }, 6.01);
      tl.fromTo("#barra-sub", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 6.01);
      // Mientras tanto, «Mi Selección» de la lista ya tiene 3 (se ve al volver)
      tl.set("#sel-vacia", { opacity: 0 }, 8.75);
      tl.set("#sel-llena", { opacity: 1 }, 8.75);
      tl.set("#packs", { y: 88 }, 8.75);

      // Volver atrás con la flecha
      camara(9.75, 1, 180, 400, 0.7);
      moverToque(9.85, 28, 52, 0.6);
      pulsar(10.6, 28, 52);
      tl.to("#detalle", { x: 372, duration: 0.4, ease: "power3.in" }, 10.85);
      tl.to("#lista", { x: 0, duration: 0.4, ease: "power3.in" }, 10.85);
      ocultarToque(10.85);

      // ---------- 11,3–13,3 s · «Mi Selección» con 3 stickers → Importar a WhatsApp ----------
      camara(11.4, 1.15, 180, 230, 0.9);
      aparecerToque(12.25, 220, 400);
      moverToque(12.4, 180, 278, 0.55);
      pulsar(13.1, 180, 278, "#rizo-importar");

      // ---------- 13,3–16 s · Diálogo «Personaliza tu pack» → Añadir ----------
      tl.to("#velo", { opacity: 1, duration: 0.22 }, 13.3);
      abrirDialogo(13.3, "#dlg-nombre");
      ocultarToque(13.3);
      camara(13.3, 1.12, 180, 400, 0.7);
      // Cursor que parpadea en el nombre
      [13.8, 14.6, 15.4].forEach((t) => {
        tl.set("#cursor", { opacity: 0 }, t);
        tl.set("#cursor", { opacity: 1 }, t + 0.4);
      });
      aparecerToque(14.65, 250, 600);
      moverToque(14.8, 238.4, 483, 0.6);
      pulsar(15.6, 238.4, 483, "#rizo-confirmar");
      cerrarDialogo(15.85, "#dlg-nombre");
      ocultarToque(15.85);

      // ---------- 16–17,6 s · Preparando el pack ----------
      abrirDialogo(16.0, "#dlg-progreso");
      tl.fromTo("#rueda", { rotation: 0 }, { rotation: 720, duration: 1.6, ease: "none", transformOrigin: "50% 50%" }, 16.0);
      cerrarDialogo(17.45, "#dlg-progreso");

      // ---------- 17,6–20,4 s · WhatsApp abre su hoja con el pack → «Añadir a tus stickers» ----------
      tl.to("#wa", { y: 0, duration: 0.45, ease: "power3.out" }, 17.6);
      camara(17.6, 1.08, 180, 300, 0.7);
      [10, 19, 18].forEach((n, i) => nlSprite(tl, document.querySelector("#w" + n), n, 17.5, 3.0, i / 3));
      camara(19.0, 1.08, 180, 700, 0.7);
      aparecerToque(19.3, 250, 600);
      moverToque(19.45, 180, 736, 0.55);
      pulsar(20.05, 180, 736, "#rizo-wa");
      tl.to("#wa", { y: 800, duration: 0.35, ease: "power3.in" }, 20.3);
      ocultarToque(20.3);
      // La app vacía «Mi Selección» al terminar (clearSelection) y celebra
      tl.set("#sel-vacia", { opacity: 1 }, 20.5);
      tl.set("#sel-llena", { opacity: 0 }, 20.5);
      tl.set("#packs", { y: 0 }, 20.5);

      // ---------- 20,6–25 s · ¡Añadido! y vuelta a la lista (enlaza con el inicio del bucle) ----------
      tl.fromTo("#wa-aviso", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 20.6);
      tl.to("#wa-aviso", { opacity: 0, duration: 0.3 }, 22.5);
      abrirDialogo(20.7, "#dlg-exito");
      camara(20.6, 1.12, 180, 420, 0.6);
      tl.fromTo("#dlg-exito .exito-emoji", { scale: 0.4 }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, 20.8);
      aparecerToque(22.15, 250, 600);
      moverToque(22.3, 180, 484, 0.5);
      pulsar(22.95, 180, 484, "#rizo-genial");
      cerrarDialogo(23.15, "#dlg-exito");
      tl.to("#velo", { opacity: 0, duration: 0.22 }, 23.15);
      ocultarToque(23.15);
      camara(23.2, 1, 180, 400, 0.8);
      // Último fotograma idéntico al primero
      tl.set("#toque", { opacity: 0 }, 24.9);

      window.__timelines["demo"] = tl;
    </script>
  </template>
</body>
