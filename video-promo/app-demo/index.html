<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=864, height=1920" />
  <title>Nailong — demo animada de la app</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="assets/js/sprites.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 864px; height: 1920px; overflow: hidden; background: #FFFDF0; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <!-- Pantalla de móvil 9:20 (360 × 800 dp a 2,4 px/dp). La web la enseña dentro de un marco de móvil hecho con CSS. -->
  <div id="root" data-composition-id="app-demo" data-start="0" data-duration="25" data-fps="30"
       data-width="864" data-height="1920">
    <!-- Una sola toma continua, como una grabación de pantalla: lista → pack → Mi Selección → WhatsApp → añadido -->
    <div id="demo" data-composition-id="demo" data-composition-src="compositions/demo.html"
         data-start="0" data-duration="25" data-track-index="0" data-track-kind="graphics"
         data-width="864" data-height="1920" style="z-index: 1"></div>
  </div>

  <script>
    window.__timelines["app-demo"] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
