<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
</head>
<body>
  <template>
    <style>
      #root {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 50% 38%, #FFFDF0 0%, #FFF4BD 50%, #FFE66D 100%);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .clay-badge {
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 8px 24px rgba(255, 138, 0, 0.22), inset 0 2px 5px rgba(255, 255, 255, 1);
      }
    </style>

    <div data-hf-id="hf-obq5" id="root" data-composition-id="scene2" data-width="1080" data-height="1920">
      
      <!-- Fondo ambiental -->
      <div data-hf-id="hf-vsgn" class="absolute inset-0 pointer-events-none opacity-40 z-0" data-layout-allow-overflow>
        <div data-hf-id="hf-cp0y" class="absolute top-[20%] -left-10 w-72 h-36 bg-white/70 rounded-full blur-xl" data-layout-allow-overflow></div>
        <div data-hf-id="hf-2eel" class="absolute bottom-[25%] -right-12 w-80 h-40 bg-white/60 rounded-full blur-xl" data-layout-allow-overflow></div>
      </div>

      <div data-hf-id="hf-o2x8" class="relative w-full h-full flex flex-col items-center justify-between py-20 px-8 z-10">
        
        <!-- Marcador Superior de Toques -->
        <div data-hf-id="hf-jgi7" id="e2-counter-card" class="clay-badge px-10 py-5 rounded-3xl flex items-center gap-6 border-2 border-amber-300">
          <span data-hf-id="hf-jdgk" class="text-5xl">🔥</span>
          <div data-hf-id="hf-c1dl" class="text-left">
            <p data-hf-id="hf-ore8" class="text-[28px] font-black text-amber-950 uppercase tracking-wider">Toques en la pancita</p>
            <p data-hf-id="hf-cyb1" id="e2-counter-num" class="text-5xl font-black text-[#D94E00] font-mono">1,248</p>
          </div>
        </div>

        <!-- Mockup Central de Smartphone -->
        <div data-hf-id="hf-kkhd" id="e2-phone-mockup" class="relative w-[780px] h-[1060px] bg-amber-50 rounded-[64px] p-6 shadow-2xl border-[10px] border-white flex flex-col items-center justify-between overflow-hidden">
          
          <!-- Fondo dinámico interno -->
          <div data-hf-id="hf-r7wv" id="e2-phone-bg" class="absolute inset-0 bg-gradient-to-b from-amber-100 to-amber-200 -z-10"></div>
          
          <!-- Capa de Confeti Determinista (Semilla fija) -->
          <div data-hf-id="hf-q257" id="e2-confetti-container" class="absolute inset-0 pointer-events-none z-30 overflow-hidden" data-layout-allow-overflow></div>

          <!-- Cabecera del móvil -->
          <div data-hf-id="hf-7u10" class="w-full flex justify-between items-center px-6 pt-3">
            <span data-hf-id="hf-4x7c" class="text-[28px] font-black text-amber-950 tracking-wide">奶龙 Nailong</span>
            <span data-hf-id="hf-8l7w" class="px-5 py-2 rounded-full bg-[#E65100] text-white font-black text-[22px] shadow-sm" data-layout-ignore>v3.3.0</span>
          </div>

          <!-- Nailong en el móvil y números flotantes -->
          <div data-hf-id="hf-wgf3" class="relative my-auto flex items-center justify-center">
            <!-- Números flotantes (+1, +10, +50) -->
            <div data-hf-id="hf-5i8g" id="e2-float-tap1" class="absolute -top-16 right-8 text-6xl font-black text-[#D94E00] opacity-0 pointer-events-none" data-layout-allow-overlap data-layout-allow-overflow>+1</div>
            <div data-hf-id="hf-y4sk" id="e2-float-tap2" class="absolute -top-24 left-8 text-7xl font-black text-[#BF360C] opacity-0 pointer-events-none" data-layout-allow-overlap data-layout-allow-overflow>+10</div>
            <div data-hf-id="hf-bwrr" id="e2-float-tap3" class="absolute -top-28 text-8xl font-black text-[#D50000] opacity-0 pointer-events-none" data-layout-allow-overlap data-layout-allow-overflow data-layout-allow-occlusion>+50</div>
            
            <div data-hf-id="hf-1hft" id="e2-dragon-wrap" class="relative flex flex-col items-center justify-center p-3 bg-white/80 rounded-[44px] shadow-lg border-4 border-white w-[404px] h-[404px]">
              <img data-hf-id="hf-u6sx" id="e2-dragon" 
                   src="../assets/stickers/sticker_1.webp" 
                   alt="Nailong Pancita" 
                   class="w-[380px] h-[380px] object-cover rounded-[34px]" />
              <img data-hf-id="hf-ptyd" id="e2-dragon-party"
                   src="../assets/stickers/sticker_10.webp" 
                   alt="Nailong Fiesta" 
                   class="absolute inset-3 w-[380px] h-[380px] object-cover rounded-[34px] opacity-0 pointer-events-none" />
            </div>

            <!-- Cursor táctil interactivo -->
            <div data-hf-id="hf-ivqa" id="e2-finger-tap" class="absolute w-28 h-28 rounded-full border-4 border-white bg-orange-600/40 opacity-0 pointer-events-none z-20"></div>
          </div>

          <!-- Botón de Modo Fiesta -->
          <div data-hf-id="hf-n9s7" id="e2-party-btn" class="w-full max-w-[580px] py-6 px-8 rounded-3xl bg-gradient-to-r from-[#E65100] to-[#F57C00] text-white text-center shadow-lg border-2 border-white/90 mb-4 cursor-pointer">
            <span data-hf-id="hf-ajlh" class="text-4xl font-black tracking-wide flex items-center justify-center gap-4 text-white">
              <span data-hf-id="hf-qxka">🎉</span> ¡MODO FIESTA! <span data-hf-id="hf-22p7">✨</span>
            </span>
          </div>
        </div>

        <!-- Subtítulo de llamada -->
        <div data-hf-id="hf-a8hr" id="e2-caption" class="text-center">
          <p data-hf-id="hf-gaju" class="text-5xl font-black text-amber-950">
            ¡Toca su pancita y desata la fiesta!
          </p>
        </div>

      </div>
    </div>

    <script>
      // PRNG determinista con semilla fija
      function createPRNG(seed = 42) {
        let s = seed;
        return function() {
          s = (s * 16807) % 2147483647;
          return (s - 1) / 2147483646;
        };
      }

      const prng = createPRNG(98765);
      const confettiContainer = document.getElementById("e2-confetti-container");
      const confettiColors = ["#D94E00", "#FFB300", "#2E7D32", "#0288D1", "#C2185B", "#7B1FA2"];
      const confettiElements = [];

      for (let i = 0; i < 40; i++) {
        const piece = document.createElement("div");
        const size = 12 + Math.floor(prng() * 14);
        const isCircle = prng() > 0.5;
        const color = confettiColors[Math.floor(prng() * confettiColors.length)];
        
        piece.style.position = "absolute";
        piece.style.width = size + "px";
        piece.style.height = (isCircle ? size : size * 1.5) + "px";
        piece.style.backgroundColor = color;
        piece.style.borderRadius = isCircle ? "50%" : "4px";
        piece.style.left = (prng() * 680) + "px";
        piece.style.top = "-40px";
        piece.style.opacity = "0";
        confettiContainer.appendChild(piece);
        confettiElements.push({
          el: piece,
          targetY: 600 + prng() * 380,
          targetX: (prng() - 0.5) * 240,
          rotation: (prng() - 0.5) * 720,
          delay: prng() * 0.35
        });
      }

      const tl = gsap.timeline({ paused: true });

      // Entrada del Móvil y Marcador
      tl.fromTo("#e2-phone-mockup", { y: 220, scale: 0.85, opacity: 0 }, { y: 0, scale: 1, opacity: 1, ease: "back.out(1.6)", duration: 0.7 }, 0.1);
      tl.fromTo("#e2-counter-card", { y: -80, opacity: 0 }, { y: 0, opacity: 1, ease: "back.out(1.8)", duration: 0.6 }, 0.2);
      tl.fromTo("#e2-caption", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.4);

      // Toque 1 en la pancita (t = 0.8s)
      tl.fromTo("#e2-finger-tap", { opacity: 0, scale: 1.8, x: 20, y: 30 }, { opacity: 1, scale: 0.9, duration: 0.25, ease: "power2.out" }, 0.7);
      tl.to("#e2-dragon-wrap", { scaleX: 1.25, scaleY: 0.78, duration: 0.16, ease: "power2.out" }, 0.9);
      tl.to("#e2-dragon-wrap", { scaleX: 1, scaleY: 1, duration: 0.4, ease: "elastic.out(1.2, 0.3)" }, 1.06);
      tl.fromTo("#e2-float-tap1", { opacity: 0, y: 20 }, { opacity: 1, y: -70, duration: 0.4, ease: "power2.out" }, 0.9);
      tl.to("#e2-float-tap1", { opacity: 0, duration: 0.2 }, 1.35);
      tl.to("#e2-finger-tap", { opacity: 0, scale: 0.6, duration: 0.18 }, 0.98);

      // Toque 2 en la pancita (t = 1.6s)
      tl.fromTo("#e2-finger-tap", { opacity: 0, scale: 1.6, x: -30, y: 10 }, { opacity: 1, scale: 0.85, duration: 0.22, ease: "power2.out", immediateRender: false }, 1.45);
      tl.to("#e2-dragon-wrap", { scaleX: 1.3, scaleY: 0.72, duration: 0.15, ease: "power2.out" }, 1.65);
      tl.to("#e2-dragon-wrap", { scaleX: 1, scaleY: 1, duration: 0.45, ease: "elastic.out(1.4, 0.28)" }, 1.8);
      tl.fromTo("#e2-float-tap2", { opacity: 0, y: 20 }, { opacity: 1, y: -90, duration: 0.45, ease: "power2.out", immediateRender: false }, 1.65);
      tl.set("#e2-counter-num", { textContent: "1,258" }, 1.65);
      tl.to("#e2-float-tap2", { opacity: 0, duration: 0.2 }, 2.15);
      tl.to("#e2-finger-tap", { opacity: 0, scale: 0.6, duration: 0.18 }, 1.75);

      // Toque 3: Botón Modo Fiesta (t = 2.5s)
      tl.fromTo("#e2-finger-tap", { opacity: 0, scale: 1.6, x: 0, y: 380 }, { opacity: 1, scale: 0.9, duration: 0.25, ease: "power2.out", immediateRender: false }, 2.3);
      tl.to("#e2-party-btn", { scale: 0.92, duration: 0.18, ease: "power2.in" }, 2.5);
      tl.to("#e2-party-btn", { scale: 1.06, duration: 0.28, ease: "back.out(2)" }, 2.68);
      tl.to("#e2-finger-tap", { opacity: 0, scale: 0.5, duration: 0.18 }, 2.6);

      // Estallido festivo (t = 2.7s)
      tl.set("#e2-dragon", { opacity: 0 }, 2.7);
      tl.set("#e2-dragon-party", { opacity: 1 }, 2.7);
      tl.to("#e2-phone-bg", { background: "linear-gradient(to bottom, #FFE894, #FFB834)", duration: 0.3 }, 2.7);
      tl.fromTo("#e2-float-tap3", { opacity: 0, y: 20 }, { opacity: 1, y: -100, duration: 0.5, ease: "power2.out", immediateRender: false }, 2.7);
      tl.set("#e2-counter-num", { textContent: "1,308" }, 2.7);
      tl.to("#e2-float-tap3", { opacity: 0, duration: 0.3 }, 3.3);

      // Confeti
      confettiElements.forEach(item => {
        tl.fromTo(item.el, 
          { y: -30, x: 0, rotation: 0, opacity: 1 }, 
          { y: item.targetY, x: item.targetX, rotation: item.rotation, opacity: 0.8, duration: 1.4, ease: "power1.out", immediateRender: false }, 
          2.7 + item.delay
        );
      });

      // Salida fluida de Escena 2 (t = 4.0s a 4.45s)
      tl.to("#e2-phone-mockup", { y: -180, scale: 0.85, opacity: 0, duration: 0.4, ease: "power2.in" }, 4.05);
      tl.to("#e2-counter-card, #e2-caption", { opacity: 0, duration: 0.35, ease: "power2.in" }, 4.1);

      window.__timelines["scene2"] = tl;
    </script>
  </template>
</body>
</html>
