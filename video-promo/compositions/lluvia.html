<!doctype html>
<html>
<body>
  <template>
    <style>
      @font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      #root { position: absolute; inset: 0; overflow: hidden; }
      #e3-titulo { top: 175px; font-size: 168px; }
      #e3-sub { top: 365px; font-size: 104px; }
      .e3-cromo { position: absolute; width: 280px; height: 280px; padding: 12px; border-radius: 48px; }
      .e3-cromo .sprite { border-radius: 38px; }
    </style>

    <div id="root" data-composition-id="lluvia" data-width="1080" data-height="1920">
      <h1 id="e3-titulo" class="titulo">¡96 stickers!</h1>
      <h2 id="e3-sub" class="titulo">¡y se mueven!</h2>

      <!-- 12 stickers animados que caen y aterrizan en cuadrícula de 3 × 4 -->
      <div id="e3-c1" class="tarjeta e3-cromo" style="left:55px;top:530px"><div id="e3-s1" class="sprite"></div></div>
      <div id="e3-c2" class="tarjeta e3-cromo" style="left:400px;top:510px"><div id="e3-s2" class="sprite"></div></div>
      <div id="e3-c3" class="tarjeta e3-cromo" style="left:745px;top:530px"><div id="e3-s3" class="sprite"></div></div>
      <div id="e3-c4" class="tarjeta e3-cromo" style="left:55px;top:840px"><div id="e3-s4" class="sprite"></div></div>
      <div id="e3-c5" class="tarjeta e3-cromo" style="left:400px;top:820px"><div id="e3-s5" class="sprite"></div></div>
      <div id="e3-c6" class="tarjeta e3-cromo" style="left:745px;top:840px"><div id="e3-s6" class="sprite"></div></div>
      <div id="e3-c7" class="tarjeta e3-cromo" style="left:55px;top:1150px"><div id="e3-s7" class="sprite"></div></div>
      <div id="e3-c8" class="tarjeta e3-cromo" style="left:400px;top:1130px"><div id="e3-s8" class="sprite"></div></div>
      <div id="e3-c9" class="tarjeta e3-cromo" style="left:745px;top:1150px"><div id="e3-s9" class="sprite"></div></div>
      <div id="e3-c10" class="tarjeta e3-cromo" style="left:55px;top:1460px"><div id="e3-s10" class="sprite"></div></div>
      <div id="e3-c11" class="tarjeta e3-cromo" style="left:400px;top:1440px"><div id="e3-s11" class="sprite"></div></div>
      <div id="e3-c12" class="tarjeta e3-cromo" style="left:745px;top:1460px"><div id="e3-s12" class="sprite"></div></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);

      nlLetras(tl, $("#e3-titulo"), 0.1, 0.04);
      nlLetras(tl, $("#e3-sub"), 1.0, 0.035);

      // Casilla → sticker; el orden de caída salta por la cuadrícula para que no parezca una lista.
      const stickers = [10, 20, 24, 47, 9, 60, 63, 64, 77, 79, 87, 91];
      const giros = [-6, 4, -3, 5, -4, 3, -5, 6, -2, 4, -6, 3];
      const orden = [5, 1, 9, 3, 11, 7, 2, 12, 6, 10, 4, 8];
      stickers.forEach((id, i) => nlSprite(tl, $("#e3-s" + (i + 1)), id, 0, 4.5));
      // Aterrizan a 0,75 s + 0,25 s × k, justo con cada «pop».
      orden.forEach((casilla, k) => {
        nlBotar(tl, $("#e3-c" + casilla), 0.75 + 0.25 * k, { giro: giros[casilla - 1], desde: -1300, caida: 0.32 });
      });

      window.__timelines["lluvia"] = tl;
    </script>
  </template>
</body>
</html>
