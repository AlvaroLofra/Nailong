      .e6-check-tag {
        position: absolute; right: 4px; top: 4px; width: 30px; height: 30px; border-radius: 50%;

      #e6-boton-importar {

      #e6-toast {
        position: absolute; left: 40px; right: 40px; bottom: 120px; background: rgba(37, 211, 102, 0.95);
        color: #fff; font-weight: 700; font-size: 22px; text-align: center; padding: 10px 16px;

      /* Vista 2: WhatsApp Chat */

      #e6-burbuja {
        position: absolute; left: 22px; top: 150px; max-width: 380px; padding: 18px 24px; border-radius: 8px 30px 30px 30px;
        background: #fff; font-weight: 500; font-size: 30px; color: #303030;
      }
      #e6-enviado { position: absolute; right: 22px; top: 330px; width: 300px; height: 300px; }
      #e6-enviado .sprite { border-radius: 36px; }
      #e6-check { position: absolute; right: 30px; top: 640px; font-weight: 600; font-size: 28px; color: #34B7F1; }

      /* Dedito interactivo */
      #e6-dedo {
        position: absolute; left: 540px; top: 1100px; width: 100px; height: 100px; border-radius: 50%;
        background: #fff; border: 9px solid var(--naranja); box-shadow: 0 10px 0 rgba(217, 78, 0, 0.3); z-index: 20;
        opacity: 0; pointer-events: none;
      }
    </style>

    <div id="root" data-composition-id="whatsapp" data-width="1080" data-height="1920">
      <!-- Título de la app -->

      <div id="e6-movil">

            <!-- Pack 1 -->
            <div id="e6-p1" class="e6-pack">
              <div class="e6-pack-texto">

              <div class="e6-pack-texto">

              </div>
              <div class="e6-btn-add">+ Añadir</div>
            </div>

            <!-- Pack 3 -->
            <div class="e6-pack">
              <div class="e6-pack-texto">
                <div class="e6-pack-nombre">Nailong animado 3</div>
                <div class="e6-pack-num">24 stickers</div>
              </div>
              <div class="e6-pack-thumbs">
                <img src="assets/stills/sticker_63.webp" alt="" />
                <img src="assets/stills/sticker_77.webp" alt="" />
              </div>
              <div class="e6-btn-add">+ Añadir</div>
            </div>

            <!-- Pack 4 -->
            <div class="e6-pack">
              <div class="e6-pack-texto">
                <div class="e6-pack-nombre">Nailong estático</div>
                <div class="e6-pack-num">23 stickers</div>
              </div>
              <div class="e6-pack-thumbs">

                <img src="assets/stills/sticker_4.webp" alt="" />
              </div>
              <div class="e6-btn-add">+ Añadir</div>
            </div>
          </div>

          <!-- Vista 1B: Carpeta abierta con stickers para selección individual -->
          <div id="e6-app-pack" class="e6-vista">
            <div class="e6-cabecera" data-layout-allow-overlap>
              <span>← Nailong animado 1</span>
              <span style="font-size:24px">🔍</span>
            </div>
            <div class="e6-pack-header">Toca stickers para importarlos:</div>
            <div class="e6-stickers-grid">
              <div id="e6-caja-stk1" class="e6-stk-item">
                <img src="assets/stills/sticker_2.webp" alt="" />
                <div id="e6-chk1" class="e6-check-tag">✓</div>
              </div>
              <div id="e6-caja-stk2" class="e6-stk-item">
                <img src="assets/stills/sticker_72.webp" alt="" />
                <div id="e6-chk2" class="e6-check-tag">✓</div>
              </div>
              <div id="e6-caja-stk3" class="e6-stk-item">

                <div id="e6-chk3" class="e6-check-tag">✓</div>
              </div>

              <div class="e6-stk-item"><img src="assets/stills/sticker_64.webp" alt="" /></div>
            </div>

            <div id="e6-toast">¡Añadido a WhatsApp! ✓</div>

          <!-- Vista 2: un chat donde llega Nailong riéndose (sticker 72) -->
          <div id="e6-chat" class="e6-vista">
            <div class="e6-cabecera" data-layout-allow-overlap>
              <span>Mis amigos</span>
              <span style="font-size:24px">📞 🎥</span>
            </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);

      // Posicionamiento inicial seguro sin colisión con CSS
      tl.set("#e6-app-pack", { x: 520 }, 0);
      tl.set("#e6-chat", { x: 520 }, 0);
      tl.set("#e6-toast", { y: 20 }, 0);
      tl.set("#e6-chk1", { scale: 0 }, 0);
      tl.set("#e6-chk2", { scale: 0 }, 0);
      tl.set("#e6-chk3", { scale: 0 }, 0);

      // 0.0s: Título "¡Usa la App!"
      nlLetras(tl, $("#e6-linea-app"), 0.15, 0.04);

      // Móvil entra botando desde abajo
      nlBotar(tl, $("#e6-movil"), 0.35, { desde: 1300, caida: 0.35 });

      // --- PASO 1: DEMO PANTALLA PRINCIPAL ---
      // 0.65s: El dedo entra apuntando al botón "+ Añadir" del Pack 1
      tl.fromTo("#e6-dedo", { x: 300, y: 300, opacity: 0 }, { x: 180, y: -450, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.65);
      // 0.95s: Tap en "+ Añadir"
      tl.to("#e6-dedo", { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.in" }, 0.95);
      tl.to("#e6-btn-p1", { scale: 0.9, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.in" }, 0.95);
      tl.call(() => {
        const b = $("#e6-btn-p1");
        if (b) {
          b.innerText = "✓ Añadido";
          b.classList.add("anadido");
        }
      }, null, 1.05);

      // 1.25s: El dedo toca la fila del Pack 1 para entrar en la carpeta
      tl.to("#e6-dedo", { x: -80, y: -450, duration: 0.25, ease: "power2.out" }, 1.25);
      tl.to("#e6-dedo", { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, 1.45);
      tl.to("#e6-p1", { backgroundColor: "#FFF2D1", duration: 0.08, yoyo: true, repeat: 1 }, 1.45);

      // 1.55s: Entramos a la vista de carpeta
      tl.fromTo("#e6-app-pack", { x: 520 }, { x: 0, duration: 0.35, ease: "power3.out" }, 1.55);

      // --- PASO 2: SELECCIÓN DE STICKERS SUELTOS ---
      // Dedo toca sticker 1 (sticker_2)
      tl.to("#e6-dedo", { x: -160, y: -410, duration: 0.3, ease: "power2.out" }, 1.85);
      tl.to("#e6-dedo", { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, 2.15);
      tl.fromTo("#e6-chk1", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2.5)" }, 2.18);
      tl.call(() => {
        const bi = $("#e6-boton-importar");
        if (bi) bi.innerText = "Importar a WhatsApp (1/30)";
      }, null, 2.18);

      // Dedo toca sticker 2 (sticker_72)
      tl.to("#e6-dedo", { x: 0, y: -410, duration: 0.25, ease: "power2.out" }, 2.4);
      tl.to("#e6-dedo", { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, 2.65);
      tl.fromTo("#e6-chk2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2.5)" }, 2.68);
      tl.call(() => {
        const bi = $("#e6-boton-importar");
        if (bi) bi.innerText = "Importar a WhatsApp (2/30)";
      }, null, 2.68);

      // Dedo toca sticker 3 (sticker_44)
      tl.to("#e6-dedo", { x: 160, y: -410, duration: 0.25, ease: "power2.out" }, 2.9);
      tl.to("#e6-dedo", { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, 3.15);
      tl.fromTo("#e6-chk3", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2.5)" }, 3.18);
      tl.call(() => {
        const bi = $("#e6-boton-importar");
        if (bi) bi.innerText = "Importar a WhatsApp (3/30)";
      }, null, 3.18);

      // Dedo baja al botón "Importar a WhatsApp"
      tl.to("#e6-dedo", { x: 0, y: -190, duration: 0.3, ease: "power2.out" }, 3.35);
      tl.to("#e6-dedo", { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, 3.65);
      tl.to("#e6-boton-importar", { scale: 0.94, duration: 0.08, yoyo: true, repeat: 1 }, 3.65);

      // Toast de confirmación
      tl.fromTo("#e6-toast", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "back.out(2)" }, 3.7);

      // Dedo se retira
      tl.to("#e6-dedo", { x: 300, y: 500, opacity: 0, duration: 0.35, ease: "power2.in" }, 3.9);

      // --- PASO 3: TRANSICIÓN A WHATSAPP CHAT (CONVERSACIÓN INTACTA) ---
      // Cambio de título
      tl.to("#e6-linea-app", { opacity: 0, duration: 0.25 }, 4.0);
      tl.to("#e6-linea1", { opacity: 1, duration: 0.01 }, 4.15);
      tl.to("#e6-linea2", { opacity: 1, duration: 0.01 }, 4.15);
      nlLetras(tl, $("#e6-linea1"), 4.15, 0.04);
      nlLetras(tl, $("#e6-linea2"), 4.45, 0.045);

      // Se desliza el chat de WhatsApp cubriendo la app
      tl.fromTo("#e6-chat", { x: 520 }, { x: 0, duration: 0.35, ease: "power3.out" }, 4.2);

      // Mensaje entrante de WhatsApp: "¿Tienes stickers de Nailong? 😍"
      tl.fromTo("#e6-burbuja", { scale: 0, transformOrigin: "0% 0%" }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 4.5);

      // 4.9s: Llega el sticker enviado (sticker 72) riéndose y botando
      nlSprite(tl, $("#e6-sprite-72"), 72, 4.9, 2.1);
      tl.fromTo("#e6-enviado", { scale: 0, rotation: 12, transformOrigin: "100% 100%" },
        { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)" }, 4.9);
      tl.fromTo("#e6-check", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 5.3);

      window.__timelines["whatsapp"] = tl;
    </script>
  </template>
</body>
